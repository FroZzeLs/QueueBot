name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: frozzels
          password: dckr_pat_CHFOc13uK_ynbxSZTThTqGg7e28

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: frozzels/queue_bot:latest
          cache-from: type=registry,ref=frozzels/queue_bot:cache
          cache-to: type=registry,ref=frozzels/queue_bot:cache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: run container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 195.238.126.138
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/QueueBot
            docker compose pull
            docker compose up -d
            docker image prune -f
