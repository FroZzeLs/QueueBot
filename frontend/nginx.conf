server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Для API проксируем на backend (если вы держите nginx отдельным доменом).
  # В текущем docker-compose backend будет доступен по имени сервиса `backend`,
  # поэтому фронтенд делает запросы к тому же origin, если вы раздаёте его через reverse proxy.
}

